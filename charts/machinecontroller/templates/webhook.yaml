apiVersion: v1
kind: Secret
metadata:
  name: machinecontroller-webhook-serving-cert
  namespace: kube-system
data:
  "cert.pem": |
{{.Values.certificates.MachineControllerWebhookCert | b64enc | indent 4}}
  "key.pem": |
{{.Values.certificates.MachineControllerWebhookKey | b64enc | indent 4}}
  "ca.crt": |
{{.Values.certificates.KubernetesCA | b64enc | indent 4}}

{{if .Values.registryCredentials}}
---
apiVersion: v1
kind: Secret
metadata:
  name: kubeone-registry-credentials
  namespace: kube-system
data:
{{range .Values.registryCredentials}}
  {{.RegistryName | quote}}: |
{{mustToRawJson .Auth | b64enc | indent 4}}
{{end}}
{{end}}

---
apiVersion: v1
kind: Service
metadata:
  name: machine-controller-webhook
  namespace: kube-system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9876
  selector:
    app: machine-controller-webhook
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine-controller-webhook
  namespace: kube-system
  labels:
    app: machine-controller-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-controller-webhook
  template:
    metadata:
      labels:
        app: machine-controller-webhook
      annotations:
        "kubeone.k8c.io/credentials-hash": "{{.Values.machineControllerCredentialsHash}}"
        "kubeone.k8c.io/cabundle-hash": "{{CABundle | sha256sum}}"
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: Exists
          effect: NoSchedule
        - key: "node-role.kubernetes.io/master"
          operator: Exists
          effect: NoSchedule
        - key: "node.cloudprovider.kubernetes.io/uninitialized"
          value: "true"
          effect: NoSchedule
        - key: "CriticalAddonsOnly"
          operator: Exists
      serviceAccountName: machine-controller-webhook
      containers:
        - image: "{{getImage "MachineController"}}"
          imagePullPolicy: IfNotPresent
          name: machine-controller-webhook
          command:
            - /usr/local/bin/webhook
          args:
            - -listen-address=0.0.0.0:9876
            - -namespace=kube-system
            {{if .Values.config.CloudProvider.External}}- -node-external-cloud-provider
            {{end}}{{if CABundle}}- -ca-bundle={{.Values.resources.CABundleSSLCertFilePath}}
            {{end}}- -tls-cert-path=/tmp/cert/cert.pem
            - -tls-key-path=/tmp/cert/key.pem
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: HTTPS_PROXY
              value: "{{.Values.config.Proxy.HTTPS}}"
            - name: NO_PROXY
              value: "{{.Values.config.Proxy.NoProxy}}"
{{with .Values.config.CloudProvider.Kubevirt}}{{with .InfraNamespace}}
            - name: POD_NAMESPACE
              value: "{{.}}"
{{end}}
{{end}}
{{.Values.machineControllerCredentialsEnvVars | indent 12}}
          volumeMounts:
            - name: machinecontroller-webhook-serving-cert
              mountPath: /tmp/cert
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9876
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9876
              scheme: HTTPS
            periodSeconds: 5
      volumes:
        - name: machinecontroller-webhook-serving-cert
          secret:
            secretName: machinecontroller-webhook-serving-cert
            defaultMode: 0444
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: machinedeployments.machine-controller.kubermatic.io
webhooks:
  - name: machinedeployments.machine-controller.kubermatic.io
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions: ["v1"]
    rules:
      - apiGroups:
          - "cluster.k8s.io"
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - machinedeployments
    clientConfig:
      service:
        namespace: kube-system
        name: machine-controller-webhook
        path: /machinedeployments
      caBundle: |
{{.Values.certificates.KubernetesCA | b64enc | indent 8}}
  - name: machines.machine-controller.kubermatic.io
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions: ["v1"]
    rules:
      - apiGroups:
          - "cluster.k8s.io"
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - machines
    clientConfig:
      service:
        namespace: kube-system
        name: machine-controller-webhook
        path: /machines
      caBundle: |
{{.Values.certificates.KubernetesCA | b64enc | indent 8}}
